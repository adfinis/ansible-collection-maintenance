---

- name: This task only serves as a template for the tasks below
  ansible.builtin.set_fact:
    ignoreme: &task
      name: "{{ taskid }}: {{ task_name }}"
      register: task
      when:
        - "taskid not in maintenance_exclude_tasks"
        - "maintenance_only is not defined or maintenance_only == taskid"
  vars:
    taskid: ignoreme
    task_name: bar


- <<: *task
  # This is an example task
  vars:
    taskid: 00-000
    task_name: "Example: This is an example task"
  check_mode: yes  # We only want to know about changes, not actually apply them
  ansible.builtin.lineinfile:
    path: /etc/aliases
    regexp: "^root:"
    line: "root: serverlogs@example.org"
    insertbefore: EOF
