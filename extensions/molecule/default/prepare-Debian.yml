---

- name: Install packages
  ansible.builtin.apt:
    name:
      - openssh-server
      - postfix

- name: SSH working directory
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Add security repo (deb822)
  ansible.builtin.deb822_repository:
    name: debian-security
    types: deb
    uris: https://security.debian.org/debian-security
    suites: "{{ ansible_distribution_release }}"
    components:
      - main
  when:
    - ansible_facts.distribution_major_version | int >= 12

- name: Add security repo
  ansible.builtin.apt_repository:
    repo: "deb https://security.debian.org/debian-security {{ ansible_distribution_release }}/updates main"
  when:
    - ansible_facts.distribution_major_version | int <= 11
